name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain version
        run: moon version

      - name: Check (0 error, 0 warning)
        run: moon check

      - name: Test
        run: moon test

      - name: Build wasm-gc
        run: |
          moon build --target wasm-gc --release
          ls -l _build/wasm-gc/release/build/cmd/main/main.wasm

      - name: Build native
        run: |
          moon build --target native
          BIN=$(find _build/native -type f \( -name "main" -o -name "main.exe" \) | head -1)
          echo "native binary: $BIN"
          "$BIN" transform EPSG:4326 EPSG:32650 116.3912 39.9075

      - name: Smoke test CLI
        run: |
          moon run cmd/main -- transform EPSG:4326 EPSG:32650 116.3912 39.9075
          moon run cmd/main -- describe 27700 | head -5

      - name: Code size
        run: |
          find . -name "*.mbt" -not -path "./_build/*" | xargs wc -l | tail -1
